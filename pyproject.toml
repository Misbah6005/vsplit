[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsplit"
version = "0.1.0"
description = "Fast video splitter CLI — stream-copy by default, optional universal MP4 re-encode"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Misbah6005" },
]
keywords = ["video", "ffmpeg", "splitter", "cli", "mp4", "mkv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/Misbah6005/vsplit"
Issues = "https://github.com/Misbah6005/vsplit/issues"
Source = "https://github.com/Misbah6005/vsplit"

[project.scripts]
vsplit = "vsplit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["vsplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ffmpeg: tests that require ffmpeg/ffprobe on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vsplit"]

[tool.ruff.lint.per-file-ignores]
"vsplit/cli.py" = ["B008", "B904", "B023"]
"vsplit/wizard.py" = ["B007", "B023"]
